name: Release beta

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-beta-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  helixd-template:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qualified-helixd-template.yml
    with:
      ref: ${{ github.ref }}
      fast_runners: false

  # One draft up front so parallel uploads cannot race into duplicate drafts.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Helix $GITHUB_REF_NAME (beta)" --notes "Closed beta build. Windows binaries are unsigned."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [helixd-template, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            builder_args: --win
          - os: ubuntu-latest
            builder_args: --linux AppImage deb rpm --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HELIX_REQUIRE_HELIXD_TEMPLATE: '1'
      HELIX_WIN_UNSIGNED: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Tag must match package.json version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Use external node-gyp (Linux)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm

      - name: Ensure Rust for the Windows CLI launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            rustup toolchain install stable --profile minimal
            rustup default stable
          }

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app
        shell: bash
        run: pnpm run build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          HELIX_BUILD_IDENTITY: stable
          HELIX_POSTHOG_WRITE_KEY: ${{ secrets.HELIX_POSTHOG_WRITE_KEY }}

      - uses: actions/download-artifact@v8
        with:
          name: helixd-template
          path: out/helixd-template

      - name: Package and upload to draft release
        shell: bash
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs ${{ matrix.builder_args }} --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELIX_REUSE_PREPARED_NATIVE_RUNTIME: ${{ runner.os == 'Windows' && '1' || '' }}
